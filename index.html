<h1>Dial Drive</h1>
<p>Dial Drive は、車載用 Android 端末（OTTOCAST P3Pro）で動く個人用のランチャー兼音楽プレーヤーです。アウディの MMI ダイヤルで操作できるように作られています。</p>
<p>YouTube Data API を使って、YouTube の公式ミュージックビデオの再生や、利用者本人の YouTube アカウントにある非公開プレイリスト「Dial Drive オフライン」の管理を行います。</p>
<p>このアプリは開発者本人のみが利用する個人用アプリで、一般には配布していません。</p>
